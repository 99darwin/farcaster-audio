services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: farcaster_audio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    command: arq app.workers.voice_note_worker.WorkerSettings
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

volumes:
  pgdata:
