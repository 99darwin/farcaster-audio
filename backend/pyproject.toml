[project]
name = "farcaster-audio-client-backend"
version = "0.1.0"
description = "Backend API for Farcaster Audio Spaces Client"
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.isort]
profile = "black"
line_length = 88
