name: Backend CI/CD

on:
  push:
    branches: [main]
    paths: ['backend/**']
  pull_request:
    branches: [main]
    paths: ['backend/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install ruff==0.6.9 black==24.10.0

      - name: Ruff
        run: ruff check .

      # Black is advisory pending a one-shot `black .` reformat across 49
      # files. Drop `continue-on-error` once that lands.
      - name: Black
        run: black --check .
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          JWT_SECRET: test-secret
          NEYNAR_API_KEY: test
          NEYNAR_CLIENT_ID: test
          LIVEKIT_API_KEY: test
          LIVEKIT_API_SECRET: test
          LIVEKIT_WS_URL: wss://test.livekit.cloud
          ENVIRONMENT: test
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          NEYNAR_API_KEY: test
          NEYNAR_CLIENT_ID: test
          LIVEKIT_API_KEY: test
          LIVEKIT_API_SECRET: test
          LIVEKIT_WS_URL: wss://test.livekit.cloud
          ENVIRONMENT: test
        run: pytest -v

